name: Bug report
description: Report a reproducible routing, installation, or protocol failure.
body:
  - type: markdown
    attributes:
      value: "Share a minimal synthetic example. Remove tokens, private prompts, thread identifiers, and personal paths from diagnostics. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Codex CLI/daemon version if known, repository revision, routing mode, and classifier mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands and a small synthetic prompt. State whether this is auto, run, or the legacy hook.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Include the expected selection or retention and the actual result.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Relevant config, doctor, or status fields and any skipped checks. Do not paste full private session logs.
