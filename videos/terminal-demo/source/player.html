<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Task Router — captioned terminal replay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#19382F;color:#F3F0E8;font:16px Arial,sans-serif}main{max-width:540px;margin:auto}#picture{width:100%;aspect-ratio:9/16;overflow:hidden;background:#F3F0E8}#picture svg{display:block;width:100%;height:100%}.controls{display:flex;align-items:center;gap:12px;padding:16px}button{font:inherit;border:0;background:#F3F0E8;color:#19382F;padding:10px 14px;border-radius:5px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #F0CF83;outline-offset:3px}input{flex:1;min-width:40px;accent-color:#9BDCB7}#clock{white-space:nowrap;font-variant-numeric:tabular-nums}.note{font-size:13px;line-height:1.5;margin:0;padding:0 16px 18px;color:#CAD7CD}body.export{overflow:hidden}body.export main{max-width:none}body.export .controls,body.export .note{display:none}@media(min-width:700px){main{max-width:min(540px,calc((100vh - 130px)*9/16))}}
</style></head><body><main aria-label="Captioned terminal replay"><div id="picture"></div>
<div class="controls"><button id="play" aria-label="Play video">Play</button><button id="restart">Restart</button><input id="seek" type="range" min="0" max="35" step="0.033333" value="0" aria-label="Video position"><span id="clock">0:00 / 0:35</span></div>
<p class="note">A reconstruction of three verified, consecutive terminal turns from 8 October 2026. Task mode; prompt excerpts; anonymized project path; edited timing. The selection panel is an editorial overlay from recorded settings. Intentionally silent. Works offline.</p>
</main><script>/*__ART__*/</script><script>
const picture=document.getElementById('picture'),seek=document.getElementById('seek'),play=document.getElementById('play');
let position=0,playing=false,anchor=0,raf=0,lastFrame=-1;
if(new URLSearchParams(location.search).has('render'))document.body.classList.add('export');
window.renderAt=function(seconds){position=Math.max(0,Math.min(35,Number(seconds)||0));const frame=Math.min(1049,Math.floor(position*30+1e-7));if(frame!==lastFrame){picture.innerHTML=TerminalDemo.frame(frame/30);lastFrame=frame;}seek.value=position;document.getElementById('clock').textContent='0:'+String(Math.floor(position)).padStart(2,'0')+' / 0:35';return frame;};
function stop(){playing=false;cancelAnimationFrame(raf);play.textContent=position>=35?'Replay':'Play';play.setAttribute('aria-label','Play video');}
function tick(now){if(!playing)return;renderAt((now-anchor)/1000);if(position>=35){stop();return;}raf=requestAnimationFrame(tick);}
function toggle(){if(playing){stop();return;}if(position>=35)position=0;playing=true;anchor=performance.now()-position*1000;play.textContent='Pause';play.setAttribute('aria-label','Pause video');raf=requestAnimationFrame(tick);}
play.addEventListener('click',toggle);
document.getElementById('restart').addEventListener('click',()=>{renderAt(0);anchor=performance.now();});
seek.addEventListener('input',()=>{renderAt(Number(seek.value));anchor=performance.now()-position*1000;});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
renderAt(0);window.filmReady=true;
</script></body></html>
